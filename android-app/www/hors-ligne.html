<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pas de connexion</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF6F0;color:#341A0B;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .boite{max-width:320px}
  .icone{width:72px;height:72px;margin:0 auto 20px;border-radius:18px;background:#341A0B;display:grid;place-items:center;font-size:34px}

  p{margin:0 0 24px;color:#6B4226;line-height:1.5}
  button{width:100%;padding:14px;border:0;border-radius:14px;background:#C15C3D;color:#fff;font-size:16px;font-weight:600}
</style></head>
<body><div class="boite">
  <div class="icone" aria-hidden="true">🍰</div>
  <h1>Pas de connexion</h1>
  <p>L'espace de gestion a besoin d'internet pour s'ouvrir. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
  <button type="button" onclick="location.href='https://kmauger18.github.io/Juste-une-part-gestion/'">Réessayer</button>
